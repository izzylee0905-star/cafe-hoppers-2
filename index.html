<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cafe hoppers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#C3D6E8; --cream:#FFFAEB; --orange:#C85103; --brown:#663924;
  --busy:#F2453D; --moderate:#FFC400; --quiet:#34C759;
  --stage-bg:#EFE6D3; --stage-ink:#663924; --stage-soft:#8a6a58; --bezel:#3a2d27;
  --s:1; --top:82px; --mapb:84px; --rad:56px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --stage-bg:#1d1714; --stage-ink:#eadfcd; --stage-soft:#b49a86; --bezel:#0c0908; }
}
:root[data-theme="dark"]{ --stage-bg:#1d1714; --stage-ink:#eadfcd; --stage-soft:#b49a86; --bezel:#0c0908; }

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--stage-bg)}
body{
  margin:0;height:100%;background:var(--stage-bg);overflow:hidden;
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:700;color:var(--brown);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}

/* ---------- stage + phone frame ---------- */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:28px}
.side{max-width:236px;color:var(--stage-ink);font-weight:500;font-size:15px;line-height:1.5}
.side h2{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:.01em}
.side p{margin:0 0 14px;color:var(--stage-soft)}
.side button{border:2px solid var(--stage-ink);color:var(--stage-ink);border-radius:99px;padding:9px 18px;font-weight:700}
#wrap{width:calc(402px*var(--s));height:calc(872px*var(--s));flex:none}
#device{
  position:relative;width:402px;height:872px;transform:scale(var(--s));transform-origin:0 0;
  border-radius:var(--rad);background:var(--cream);
  box-shadow:0 0 0 11px var(--bezel),0 30px 70px rgba(30,15,5,.28);
}
#app{position:absolute;inset:0;overflow:hidden;border-radius:var(--rad);clip-path:inset(0 round var(--rad));contain:paint;isolation:isolate}
@media (max-width:820px){ .side{display:none} }
@media (max-width:520px){
  :root{--top:30px;--mapb:26px;--rad:0px}
  html,body{background:var(--screen-bg,var(--cream))}
  #stage{display:block;padding:0}
  #wrap{width:100%;height:100%}
  #device{width:100%;height:100%;transform:none;box-shadow:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--top) 32px 0;background:var(--cream);overflow:hidden}
.screen.enter{animation:enter .26s ease both}
.screen.leave{animation:leave .2s ease both;pointer-events:none}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0}}

.mask{display:block;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:var(--brown)}

/* welcome */
.screen.welcome{background:var(--blue);align-items:center;justify-content:center;padding:0 31px}
.w-title{width:262px;aspect-ratio:1300/690}
.w-logo{width:258px;aspect-ratio:640/611;margin-top:34px}
.w-tag{margin:48px 0 0;font-size:22px;letter-spacing:.02em;text-align:center}
.btn-cream{margin-top:34px;width:100%;height:58px;border-radius:99px;background:var(--cream);font-size:18px;letter-spacing:.03em;text-align:center}

/* header bar */
.bar{position:relative;flex:none;height:44px;display:flex;align-items:center;justify-content:space-between}
.bar h1{margin:0;font-size:26.5px;line-height:1;letter-spacing:0;white-space:nowrap}
.bar.center h1{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.icons{display:flex;gap:4px;margin-right:-6px}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;position:relative;z-index:1}
.ibtn svg{width:26px;height:26px;fill:none;stroke:var(--brown);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bar.center .ibtn:first-child{margin-left:-8px}
.sbox{flex:1;height:44px;border-radius:99px;background:var(--blue);display:flex;align-items:center;padding:0 20px;margin-right:10px}
.sbox:focus-within{box-shadow:inset 0 0 0 1.5px var(--orange)}
.sbox input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--brown);letter-spacing:.02em}
.sbox input::placeholder{color:rgba(102,57,36,.6)}
.sbox input::-webkit-search-cancel-button{display:none}

/* home */
.chips{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:3px}
.chip{height:40px;border-radius:99px;background:var(--orange);color:var(--cream);font-size:16px;letter-spacing:.03em;text-align:center;transition:background .18s,color .18s,transform .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--brown)}
.list{flex:1;min-height:0;overflow-y:auto;margin:19px -32px 0;padding:0 32px 36px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none;overscroll-behavior:contain}
.list::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;height:193px;border-radius:45px;overflow:hidden;isolation:isolate;color:var(--cream);text-align:left;transition:transform .15s}
.card:has(.card-open:active){transform:scale(.985)}
.card .bg{position:absolute;inset:0;z-index:-2}
.card::after{content:"";position:absolute;inset:0;background:rgba(102,57,36,.68);z-index:-1}
.card .name{position:absolute;left:25px;top:20px;font-size:28px;line-height:1.15;letter-spacing:.04em}
.card .tag{position:absolute;left:25px;top:54px;right:16px;font-size:14px;letter-spacing:.02em;color:var(--blue);white-space:nowrap}
.card .stat{position:absolute;left:25px;bottom:24px;display:flex;align-items:center;gap:10px;font-size:22px;letter-spacing:.03em}
.card .stat small{font-size:15px;color:var(--blue);letter-spacing:.03em;margin-left:2px}
.card .name,.card .tag,.card .stat{pointer-events:none}
.card .stat.none,.card .stat.loading{font-size:13.5px;letter-spacing:.01em;gap:8px}
.card-open{position:absolute;inset:0;z-index:1;border-radius:inherit}
.card-upd{position:absolute;right:25px;bottom:17px;z-index:2;min-width:132px;height:36px;padding:0 16px;display:grid;place-items:center;border-radius:99px;background:var(--cream);color:var(--orange);font-size:13.5px;letter-spacing:.03em}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--quiet);transition:background .4s}
.dot.busy{background:var(--busy)} .dot.moderate{background:var(--moderate)} .dot.none,.dot.loading{background:#BDB3A8}
.empty{margin:28px 6px;font-size:17px;line-height:1.45;font-weight:500;text-align:center}

/* cafe screens */
.hero{position:relative;flex:none;height:194px;margin-top:8px;border-radius:45px;overflow:hidden}
.hero .ph{position:absolute;inset:0;display:grid;place-items:center}
.hero .ph i{width:96px;aspect-ratio:640/611;background:var(--cream);opacity:.5}
.tabs{flex:none;display:flex;justify-content:space-between;margin-top:16px}
.tab{padding:4px 0;font-size:15px;letter-spacing:.03em;color:var(--orange);text-underline-offset:5px;text-decoration-thickness:2px}
.tab[aria-selected="true"]{text-decoration:underline}
.content{flex:1;min-height:0;overflow-y:auto;margin:20px -32px 0;padding:0 32px 40px;scrollbar-width:none;overscroll-behavior:contain}
.content::-webkit-scrollbar{display:none}
.content.fade{animation:fade .24s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.locs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.loc{height:32px;padding:0 15px;border-radius:99px;border:2px solid var(--orange);color:var(--orange);font-size:13.5px;letter-spacing:.03em;transition:background .18s,color .18s,border-color .18s}
.loc[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--brown)}
.desc{margin:0;font-size:17px;line-height:1.42;letter-spacing:.02em}
.hours{margin:22px 0 0;font-size:17px;letter-spacing:.02em}
.note{margin:6px 0 0;font-size:13px;font-weight:500;opacity:.8}
.btn-orange,.btn-blue{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 22px;border-radius:99px;font-size:16px;letter-spacing:.04em}
.btn-orange{background:var(--orange);color:var(--cream);margin-top:18px}
.btn-blue{background:var(--blue);color:var(--brown)}
.h3{margin:30px 0 14px;font-size:17px;letter-spacing:.02em}
.menu-row{display:flex;gap:14px;margin:0 -32px;padding:0 32px 6px;overflow-x:auto;scrollbar-width:none;cursor:grab;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.menu-row::-webkit-scrollbar{display:none}
.menu-row::after{content:"";flex:none;width:18px}
.menu-row.drag{scroll-snap-type:none;cursor:grabbing}
.drink{flex:none;width:142px;height:103px;border-radius:45px;background:var(--blue);display:flex;align-items:center;gap:11px;padding-left:24px;scroll-snap-align:start;user-select:none;-webkit-user-select:none}
.drink img{height:62px;width:auto;pointer-events:none;-webkit-user-drag:none}
.drink span{font-size:15px;line-height:1.22;letter-spacing:.03em}

.status{display:flex;align-items:center;gap:13px;font-size:20px;letter-spacing:.03em}
.lab{margin:28px 0 12px;font-size:16px;letter-spacing:.03em}
.meter{height:17px;border-radius:99px;background:var(--blue);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--brown);transition:width .7s cubic-bezier(.2,.8,.2,1);animation:fillIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fillIn{from{width:0}}
.chart{display:flex;align-items:flex-end;gap:2px;height:150px;margin-top:0}
.chart i{flex:1;border-radius:16px 16px 0 0;background:var(--blue);transform-origin:50% 100%;transition:background .4s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms)}
.chart i.on{background:var(--brown)}
@keyframes rise{from{transform:scaleY(0)}}

.revs{display:flex;flex-direction:column;gap:19px}
.review{background:var(--blue);border-radius:40px;padding:15px 24px 14px}
.stars{display:flex;gap:4px}
.stars svg{width:19px;height:19px;display:block}
.review p{margin:8px 0 6px;font-size:15px;line-height:1.38;letter-spacing:.03em}
.review .by{text-align:right;font-size:15px}

/* map */
.mapbox{position:relative;flex:1;min-height:0;margin:8px 0 var(--mapb);border-radius:45px;overflow:hidden;background:#fff;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapbox:active{cursor:grabbing}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;width:34px;height:44px;margin:-44px 0 0 -17px;pointer-events:none;will-change:transform}
.pin[aria-pressed="true"]{z-index:2}
.pin svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 2px 3px rgba(60,30,10,.4));transition:transform .2s;transform-origin:50% 100%}
.pin[aria-pressed="true"] svg{transform:scale(1.25)}
.plabel,.lm{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
.plabel{font-size:12.5px;color:var(--brown);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 5px #fff}
.lm{font-size:11.5px;color:#6a7a5c;text-shadow:0 0 3px #fff,0 0 3px #fff}
.pins.labels .plabel{opacity:1}
.pins.landmarks .lm{opacity:.85}
.mctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mctl button{width:40px;height:40px;border-radius:50%;background:var(--cream);box-shadow:0 2px 8px rgba(60,30,10,.25);display:grid;place-items:center}
.mctl svg{width:22px;height:22px;fill:none;stroke:var(--brown);stroke-width:2.6;stroke-linecap:round}
.popup{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:var(--cream);border-radius:32px;padding:16px 20px;box-shadow:0 6px 24px rgba(60,30,10,.28);animation:pop .22s ease both;cursor:default}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.popup h3{margin:0;font-size:20px;letter-spacing:.02em;padding-right:36px}
.popup .sub{margin-top:2px;font-size:13.5px;color:var(--orange);letter-spacing:.03em}
.popup .row{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:15px;letter-spacing:.02em}
.popup .acts{display:flex;gap:8px;margin-top:14px}
.popup .acts .btn-orange,.popup .acts .btn-blue{height:36px;padding:0 18px;font-size:14.5px;margin:0}
.popup .x{position:absolute;right:8px;top:8px;width:34px;height:34px}
.popup .x svg{width:22px;height:22px}

/* survey */
.content.survey{margin-top:38px}
.q{text-align:center}
.q+.q{margin-top:40px}
.ql{margin:0 0 18px;font-size:17px;line-height:1.3;letter-spacing:.02em}
.scale,.caps{display:grid;grid-template-columns:repeat(5,52px);justify-content:center}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt .num{font-size:16px;line-height:18px;letter-spacing:.02em}
.ring{width:26px;height:26px;border-radius:50%;border:4px solid var(--blue);background:var(--cream);display:grid;place-items:center;transition:border-color .2s}
.ring::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.opt input:checked~.ring::after{transform:scale(1)}
.opt input:focus-visible~.ring{outline:3px solid var(--orange);outline-offset:3px}
.q.need .ring{border-color:var(--orange)}
.caps{margin-top:6px}
.caps span{font-size:12.5px;letter-spacing:.03em;color:rgba(102,57,36,.55);text-align:center}
.btn-submit{display:flex;align-items:center;margin:48px auto 0;height:40px;padding:0 26px;border-radius:99px;background:var(--orange);color:var(--cream);font-size:15px;letter-spacing:.04em}
.err{min-height:20px;margin:12px 0 0;font-size:14px;text-align:center;color:var(--orange)}
.done{display:flex;flex-direction:column;align-items:center;margin-top:22px;opacity:0;transform:translateY(8px);visibility:hidden;transition:opacity .35s,transform .35s,visibility .35s}
.done.show{opacity:1;transform:none;visibility:visible}
.done .mask{width:155px;aspect-ratio:640/611}
.done p{margin:20px 0 0;font-size:16px;letter-spacing:.03em}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
}
</style>
</head>

<div id="stage">
  <div id="wrap">
    <div id="device"><div id="app"></div></div>
  </div>
  <aside class="side">
    <h2>cafe hoppers</h2>
    <p>an interactive prototype. click through it like you would on your phone. drag the map to pan, scroll or pinch to zoom.</p>
    <button type="button" id="restart" class="press">restart demo</button>
  </aside>
</div>

<script>
(function(){

function setPageBg(c){document.documentElement.style.setProperty('--screen-bg',c)}

function go(name,opts){
  var el=document.createElement('section');
  el.className='screen '+name+' enter';
  var builders={welcome:buildWelcome,home:buildHome,cafe:buildCafe,map:buildMap,survey:buildSurvey};
  builders[name](el,opts||{});
  var old=cur;
  app.appendChild(el); cur=el; state.screen=name; MAPCTL=null;
  setPageBg(name==='welcome'?'#C3D6E8':'#FFFAEB');
  if(old){old.classList.remove('enter');old.classList.add('leave');setTimeout(function(){old.remove()},220)}
  if(name==='map') requestAnimationFrame(function(){initMap(el)});
}

/* ---------- welcome ---------- */
function buildWelcome(el){
  el.innerHTML='<i class="mask m-title w-title" role="img" aria-label="cafe hoppers"></i>'+

}

/* ---------- home ---------- */
function hbar(){
  var icons='<button class="ibtn press" data-act="map" aria-label="open cafe finder map">'+I.pin+'</button>';
  if(state.search){
    return '<label class="sbox"><input id="q" type="search" value="'+esc(state.q)+'" placeholder="search cafes" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="search cafes"></label>'+
      '<div class="icons"><button class="ibtn press" data-act="search" aria-label="close search">'+I.close+'</button>'+icons+'</div>';
  }
  return '<h1>find a study spot</h1><div class="icons"><button class="ibtn press" data-act="search" aria-label="search cafes">'+I.search+'</button>'+icons+'</div>';
}
function chips(){
  return [['all','all cafes'],['trendy','trendy'],['quiet','quiet']].map(function(f){
    return '<button class="chip" data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(state.filter===f[0])+'">'+f[1]+'</button>';
  }).join('');
}
function matches(c){
  if(state.filter!=='all' && !c[state.filter]) return false;
  var q=norm(state.q.trim()); if(!q) return true;
  var hay=norm([c.name,c.tagline].concat(c.locations.map(function(l){return l.label+' '+l.address})).join(' '));
  return hay.indexOf(q)>-1;
}
function list(){
  var items=CAFES.filter(matches);
  if(!items.length) return '<p class="empty">no cafes match “'+esc(state.q.trim())+'”. try a different name or clear the filter.</p>';
  return items.map(function(c){
    var l=locOf(c), lv=lvOf(l), multi=c.locations.length>1;
    return '<div class="card">'+
      '<span class="bg '+c.bg+'"></span><span class="name">'+c.name+'</span><span class="tag">'+c.tagline+'</span>'+
      '<span class="stat'+(lv==='none'||lv==='loading'?' '+lv:'')+'"><i class="dot '+lv+'"></i>'+LABEL[lv].short+(multi?'<small>· '+l.label+'</small>':'')+'</span>'+
      '<button class="card-open" data-act="open" data-id="'+c.id+'" aria-label="'+esc(c.name)+', '+LABEL[lv].short+'"></button>'+
      '<button class="card-upd press" data-act="survey" data-id="'+c.id+'" data-from="home" aria-label="update status for '+esc(c.name)+'">update status</button></div>';
  }).join('');
}
function buildHome(el){
  el.classList.add('home');
  el.innerHTML='<div class="bar" id="hbar">'+hbar()+'</div><div class="chips" id="chips">'+chips()+'</div><div class="list" id="list">'+list()+'</div>';
}

  }).join('')+'</div>';
}

/* ================= map ================= */
var PINS=[];
CAFES.forEach(function(c){c.locations.forEach(function(l,i){PINS.push({c:c,l:l,i:i})})});
var LAT0=38.0345, LNG0=-78.4995, MLNG=111320*Math.cos(LAT0*Math.PI/180), MLAT=111200;
function toXY(lat,lng){return [(lng-LNG0)*MLNG,-(lat-LAT0)*MLAT]}
PINS.forEach(function(p){var xy=toXY(p.l.lat,p.l.lng);p.x=xy[0];p.y=xy[1]});
var LANDMARKS=[{t:'the lawn',lat:38.0343,lng:-78.5030},{t:'the corner',lat:38.0364,lng:-78.4985}];

function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
var WORLD=null;
function world(){
  if(WORLD) return WORLD;
  var R=rng(11), A=-12*Math.PI/180, ca=Math.cos(A), sa=Math.sin(A), x, y, i, j;
  var cols=[], rows=[];
  for(x=-5200;x<5600;){var w=110+R()*150,g=R()<.14?34:14;cols.push([x,w]);x+=w+g}
  for(y=-5400;y<5400;){var h=85+R()*105,g2=R()<.16?34:14;rows.push([y,h]);y+=h+g2}
  var parks=[[toXY(38.0343,-78.5030),150],[toXY(38.0378,-78.4962),95],[toXY(38.0298,-78.4978),110],[toXY(38.0372,-78.4890),80]];
  var b='',p='';
  for(i=0;i<rows.length;i++)for(j=0;j<cols.length;j++){
    var cx0=cols[j][0],cy0=rows[i][0],cw=cols[j][1],ch=rows[i][1];
    var pts=[[cx0+4,cy0+4],[cx0+cw-4,cy0+4],[cx0+cw-4,cy0+ch-4],[cx0+4,cy0+ch-4]].map(function(q){return [q[0]*ca-q[1]*sa,q[0]*sa+q[1]*ca]});
    var mx=(pts[0][0]+pts[2][0])/2,my=(pts[0][1]+pts[2][1])/2;
    if(mx<-4300||mx>4800||my<-4500||my>4500) continue;
    if(R()<.03) continue;
    var d='M'+pts.map(function(q){return q[0].toFixed(0)+' '+q[1].toFixed(0)}).join('L')+'Z';
    var isPark=R()<.045;
    for(var k=0;k<parks.length;k++){if(Math.hypot(mx-parks[k][0][0],my-parks[k][0][1])<parks[k][1])isPark=true}
    if(isPark)p+=d;else b+=d;
  }
  WORLD={b:b,p:p,w:'M-4000 800C-2400 560 -1000 1010 100 760S1600 520 4200 880'};
  return WORLD;
}

function buildMap(el){
  el.innerHTML='<div class="bar center"><button class="ibtn press" data-act="home" aria-label="back to home">'+I.back+'</button><h1>cafe finder</h1><span class="ibtn" aria-hidden="true"></span></div>'+
    '<div class="mapbox" id="mapbox"><svg id="msvg" role="img" aria-label="map of cafes near UVA"><g id="mworld"></g></svg>'+
    '<div class="pins" id="pins"></div>'+
    '<div class="mctl"><button data-mz="in" aria-label="zoom in">'+I.plus+'</button><button data-mz="out" aria-label="zoom out">'+I.minus+'</button><button data-mz="fit" aria-label="show all cafes">'+I.fit+'</button></div>'+
    '<div id="popup"></div></div>';
}

function initMap(el){
  var box=$('#mapbox',el); if(!box) return;
  var g=$('#mworld',el), pinsEl=$('#pins',el), popup=$('#popup',el);
  var Wd=world();
  g.innerHTML='<rect x="-9000" y="-9000" width="18000" height="18000" fill="#fff"/>'+
    '<path d="'+Wd.b+'" fill="#E4E4E4" stroke="#E4E4E4" stroke-width="8" stroke-linejoin="round"/>'+
    '<path d="'+Wd.p+'" fill="#A5D98C" stroke="#A5D98C" stroke-width="8" stroke-linejoin="round"/>'+
    '<path d="'+Wd.w+'" fill="none" stroke="#9AD0F5" stroke-width="22" stroke-linecap="round"/>';

  var html='';
  LANDMARKS.forEach(function(m,i){html+='<span class="lm" data-lm="'+i+'">'+m.t+'</span>'});
  PINS.forEach(function(p,i){html+='<span class="plabel" data-lab="'+i+'">'+p.c.name+(p.c.locations.length>1?' · '+p.l.label:'')+'</span>'});
  PINS.forEach(function(p,i){html+='<button class="pin" data-pin="'+i+'" aria-pressed="false" aria-label="'+esc(p.c.name+', '+p.l.label)+'">'+I.pinBig+'</button>'});
  pinsEl.innerHTML=html;
  var pinEls=pinsEl.querySelectorAll('.pin'), labEls=pinsEl.querySelectorAll('.plabel'), lmEls=pinsEl.querySelectorAll('.lm');
  LANDMARKS.forEach(function(m){var xy=toXY(m.lat,m.lng);m.x=xy[0];m.y=xy[1]});

  var KMIN=.1, KMAX=3;
  var M={k:.13,tx:0,ty:0,W:box.clientWidth,H:box.clientHeight,sel:-1,anim:0};

  function clampView(){
    var cx=(M.W/2-M.tx)/M.k, cy=(M.H/2-M.ty)/M.k;
    cx=Math.max(-1700,Math.min(2600,cx)); cy=Math.max(-1100,Math.min(1300,cy));
    M.tx=M.W/2-cx*M.k; M.ty=M.H/2-cy*M.k;
  }
  function apply(){
    clampView();
    g.setAttribute('transform','translate('+M.tx.toFixed(2)+' '+M.ty.toFixed(2)+') scale('+M.k.toFixed(4)+')');
    for(var i=0;i<PINS.length;i++){
      var sx=PINS[i].x*M.k+M.tx, sy=PINS[i].y*M.k+M.ty;
      pinEls[i].style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px)';
      var flip=sx>M.W*.62;
      labEls[i].style.transform='translate('+(flip?'calc(-100% + '+(sx-22).toFixed(1)+'px)':(sx+22).toFixed(1)+'px')+','+(sy-30).toFixed(1)+'px)';
    }
    for(var j=0;j<LANDMARKS.length;j++){
      var lx=LANDMARKS[j].x*M.k+M.tx, ly=LANDMARKS[j].y*M.k+M.ty;
      lmEls[j].style.transform='translate('+lx.toFixed(1)+'px,'+ly.toFixed(1)+'px) translate(-50%,-50%)';
    }
    pinsEl.classList.toggle('labels',M.k>=.42);
    pinsEl.classList.toggle('landmarks',M.k>=.3);
  }
  function fitView(pad){
    var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    PINS.forEach(function(p){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y)});
    var k=Math.min((M.W-2*pad)/Math.max(1,maxx-minx),(M.H-2*pad)/Math.max(1,maxy-miny));
    k=Math.max(KMIN,Math.min(KMAX,k));
    var cx=(minx+maxx)/2, cy=(miny+maxy)/2;
    return {k:k,tx:M.W/2-cx*k,ty:M.H/2-cy*k};
  }
  function animateTo(t,ms){
    var s={k:M.k,tx:M.tx,ty:M.ty}, t0=performance.now(), id=++M.anim; ms=ms||320;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){M.k=t.k;M.tx=t.tx;M.ty=t.ty;apply();return}
    (function step(now){
      if(id!==M.anim) return;
      var u=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-u,3);
      M.k=s.k+(t.k-s.k)*e; M.tx=s.tx+(t.tx-s.tx)*e; M.ty=s.ty+(t.ty-s.ty)*e; apply();
      if(u<1) requestAnimationFrame(step);
    })(t0);
  }
  function zoomAt(px,py,f){
    var nk=Math.max(KMIN,Math.min(KMAX,M.k*f)); f=nk/M.k;
    M.tx=px-(px-M.tx)*f; M.ty=py-(py-M.ty)*f; M.k=nk; apply();
  }
  function targetZoom(f){
    var nk=Math.max(KMIN,Math.min(KMAX,M.k*f)), r=nk/M.k, px=M.W/2, py=M.H/2;
    return {k:nk,tx:px-(px-M.tx)*r,ty:py-(py-M.ty)*r};
  }
  function local(e){
    var r=box.getBoundingClientRect(), sc=r.width/box.clientWidth||1;
    return {x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};
  }

  function renderPopup(){
    if(M.sel<0){popup.innerHTML='';return}
    var p=PINS[M.sel], lv=lvOf(p.l);
    popup.innerHTML='<div class="popup" role="dialog" aria-label="'+esc(p.c.name)+'">'+
      '<button class="ibtn x press" data-act="unsel" aria-label="close">'+I.close+'</button>'+
      '<h3>'+p.c.name+'</h3><div class="sub">'+p.l.label+'</div>'+
      '<div class="row"><i class="dot '+lv+'"></i>'+LABEL[lv].long+'</div>'+
      '<div class="acts"><button class="btn-orange press" data-act="open" data-id="'+p.c.id+'" data-loc="'+p.i+'">view cafe</button>'+
      '<a class="btn-blue press" href="'+dirUrl(p.c,p.l)+'" target="_blank" rel="noopener noreferrer">directions</a></div></div>';
  }
  function select(i){
    M.sel=i;
    for(var n=0;n<pinEls.length;n++)pinEls[n].setAttribute('aria-pressed',String(n===i));
    renderPopup();
    if(i>=0){
      var k=Math.max(M.k,.9), p=PINS[i];
      animateTo({k:k,tx:M.W/2-p.x*k,ty:M.H*.36-p.y*k},380);
    }
  }
  MAPCTL={select:select,renderPopup:renderPopup};

  /* initial view */
  M.W=box.clientWidth; M.H=box.clientHeight;
  var f=fitView(46); M.k=f.k; M.tx=f.tx; M.ty=f.ty; apply();

  /* controls */
  var ptrs=new Map(), moved=0, last=null;
  box.addEventListener('click',function(e){
    var z=e.target.closest('[data-mz]');
    if(z){
      var m=z.dataset.mz;
      if(m==='in') animateTo(targetZoom(1.8),260);
      else if(m==='out') animateTo(targetZoom(1/1.8),260);
      else {select(-1);animateTo(fitView(46),380)}
      return;
    }
    if(e.target.closest('.popup')) return;
    var pb=e.target.closest('.pin');
    if(pb && e.detail===0){select(+pb.dataset.pin);return}  /* keyboard */
    if(moved>=6) return;
    /* pointer: pick the pin nearest the tap, so overlapping pins stay tappable */
    var pt=local(e), best=-1, bd=30;
    for(var i=0;i<PINS.length;i++){
      var sx=PINS[i].x*M.k+M.tx, sy=PINS[i].y*M.k+M.ty-20, d=Math.hypot(pt.x-sx,pt.y-sy);
      if(d<bd){bd=d;best=i}
    }
    if(best>=0) select(best);
  });

  /* gestures */
  function two(){var a=Array.from(ptrs.values());return {d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2}}
  box.addEventListener('pointerdown',function(e){
    if(e.target.closest('.mctl,.popup')) return;
    M.anim++;
    box.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,local(e)); moved=0;
    last=ptrs.size===2?two():null;
  });
  box.addEventListener('pointermove',function(e){
    if(!ptrs.has(e.pointerId)) return;
    var prev=ptrs.get(e.pointerId), now=local(e);
    ptrs.set(e.pointerId,now);
    if(ptrs.size===1){
      M.tx+=now.x-prev.x; M.ty+=now.y-prev.y; moved+=Math.abs(now.x-prev.x)+Math.abs(now.y-prev.y); apply();
    }else if(ptrs.size===2){
      var t=two();
      if(last){M.tx+=t.cx-last.cx; M.ty+=t.cy-last.cy; zoomAt(t.cx,t.cy,t.d/last.d); moved+=10}
      last=t;
    }
  });
  function end(e){
    if(!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId); last=null;
    if(ptrs.size===0 && moved<6 && e.type==='pointerup' && M.sel>=0) select(-1);
  }
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',function(e){
    e.preventDefault(); M.anim++;
    var p=local(e); zoomAt(p.x,p.y,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)));
  },{passive:false});
  box.addEventListener('dblclick',function(e){
    if(e.target.closest('.mctl,.popup')) return;
    var p=local(e), nk=Math.min(KMAX,M.k*2), r=nk/M.k;
    animateTo({k:nk,tx:p.x-(p.x-M.tx)*r,ty:p.y-(p.y-M.ty)*r},260);
  });
}

    $('#a-tl',cur).textContent=loc.tables+'% of tables at capacity';
    $('#a-bar',cur).style.width=loc.tables+'%';
    $('#a-nl',cur).textContent=loc.noise+'% noise level';
    var bars=$('#a-chart',cur).children; for(var i=0;i<bars.length;i++)bars[i].classList.toggle('on',i<n);
  }
  else if(state.screen==='map'&&MAPCTL) MAPCTL.renderPopup();
}
window.CafeHoppers={
  cafes:CAFES,
  level:level,
  refresh:refresh,
  setBusyness:function(locationId,tables,noise){
    CAFES.forEach(function(c){c.locations.forEach(function(l){
      if(l.id===locationId){ if(tables!=null)l.tables=tables; if(noise!=null)l.noise=noise; l.has=true }
    })});
    refresh();
  }
};

/* ================= live data: survey answers + Google Sheets ================= */
/* Both response sheets are shared as "anyone with the link can view". */
var SHEETS={
  attendees:'https://docs.google.com/spreadsheets/d/1c2iPRc6QeQ2kJ2m1Z0RDKjQ9859EBoZqAO_JqGlgM1U/gviz/tq?tqx=out:csv',
  employees:'https://docs.google.com/spreadsheets/d/1hhEHRb0hccs-Hz8cEsGmspwfuYghuj_eADLgxMXeafI/gviz/tq?tqx=out:csv'
};
var WINDOW_MINUTES=60;     // only count reports from the last hour
var REFRESH_SECONDS=20;    // check for new reports every 20 seconds
var FORM_CAFES={grit:'grit',saxbys:'saxbys',starbucks:'starbucks',camellias:'camellias'};

function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){
    var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=ch }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f='' }
    else f+=ch;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
// Google Forms timestamps look like 11/3/2026 14:05:22
function parseTime(s){
  var m=String(s).match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)(?::(\d+))?/);
  return m?new Date(+m[3],m[1]-1,+m[2],+m[4],+m[5],+(m[6]||0)).getTime():NaN;
}
// Every valid row of one sheet's CSV -> {cafe, seats, noise, t}
function readRows(csv){
  var rows=parseCSV(csv), out=[];
  if(rows.length<2) return out;
  var head=rows[0].map(function(h){return h.toLowerCase()});
  var col=function(w){for(var i=0;i<head.length;i++)if(head[i].indexOf(w)!==-1)return i;return -1};
  var tC=col('timestamp'),cC=col('cafe'),sC=col('full'),nC=col('nois');
  if(tC<0||cC<0||sC<0||nC<0) return out;
  rows.slice(1).forEach(function(r){
    var t=parseTime(r[tC]), id=FORM_CAFES[norm(r[cC]).replace(/\s/g,'')], seats=+r[sC], noise=+r[nC];
    if(isNaN(t)||!id||!seats||!noise) return;
    out.push({cafe:id,seats:seats,noise:noise,t:t});
  });
  return out;
}
function getCSV(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).catch(function(e){console.warn('cafe hoppers: could not load',url,e);return ''})}
function toPercent(avg){return Math.round((avg-1)*25)} // 1 -> 0%, 5 -> 100%
function mean(list,key){return list.reduce(function(a,r){return a+r[key]},0)/list.length}

/* ----- answers submitted from the in-app survey ----- */
/* Every answer is (1) saved on this phone and used right away, and (2) sent in the background
   to the attendees' Google Form, so it lands in the same sheet everyone's app reads.
   Fill in SUBMIT below (see the notes that came with this file) to turn step 2 on. */
var SUBMIT={
  url:'https://docs.google.com/forms/d/e/1FAIpQLSeNslfwSzhblKQP67wITPDZsEnr2lOkZJQP3G7VHU9uanXUOw/formResponse',  // the attendees' form
  cafe:'entry.838331350',    // the cafe question
  seats:'entry.106096689',   // "how full" (2nd question in the form)
  noise:'entry.1040916962',  // "how noisy" (3rd question in the form)
  labels:{saxbys:"Saxby's",starbucks:'Starbucks',grit:'Grit',camellias:'Camellia\u2019s'}  // must match the form's cafe options exactly
};
var STORE_KEY='cafehoppers.reports', KEEP_MS=6*3600*1000;
var sheetRows={attendees:[],employees:[]}, sheetOK=false;
var mine=loadMine();
function loadMine(){
  try{
    var a=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');
    return a.filter(function(r){return r&&r.cafe&&r.seats&&r.noise&&r.t>Date.now()-KEEP_MS});
  }catch(e){return []}
}
function saveMine(){try{localStorage.setItem(STORE_KEY,JSON.stringify(mine))}catch(e){}}
function formReady(){return !!(SUBMIT.url&&SUBMIT.cafe&&SUBMIT.seats&&SUBMIT.noise)}
// has this phone's answer already shown up in the sheet? (so it isn't counted twice)
function seenInSheet(m){
  if(!formReady()||!sheetOK) return false;
  return sheetRows.attendees.some(function(r){return r.cafe===m.cafe&&r.seats===m.seats&&r.noise===m.noise&&r.t>=m.t-120000&&r.t<=m.t+600000});
}
var diag={sent:null,msg:'',sheet:'not loaded yet'};
function sendToForm(r){
  diag.sent=r;
  if(!formReady()){diag.msg='NOT SENT (form not connected)';console.info('cafe hoppers: survey answer saved on this device only (SUBMIT is not filled in yet)');return Promise.resolve(false)}
  diag.msg='sending...';
  var body=new URLSearchParams();
  body.append(SUBMIT.cafe,SUBMIT.labels[r.cafe]||r.cafe);
  body.append(SUBMIT.seats,String(r.seats));
  body.append(SUBMIT.noise,String(r.noise));
  return fetch(SUBMIT.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(){diag.msg='request accepted by the browser';return true})
    .catch(function(e){diag.msg='FAILED: '+(e&&e.message||e);console.warn('cafe hoppers: could not send answer',e);return false});
}
function addReport(cafe,seats,noise){
  var r={cafe:cafe,seats:seats,noise:noise,t:Date.now()};
  mine.push(r); mine=mine.filter(function(x){return x.t>Date.now()-KEEP_MS}); saveMine();
  recompute(); sendToForm(r);
  [4000,12000,30000].forEach(function(ms){setTimeout(loadScores,ms)});   // pick up the new row from the sheet quickly
}

/* ----- turn all recent answers into the two scales ----- */
function recompute(){
  var since=Date.now()-WINDOW_MINUTES*60*1000, report={}, changed=false;
  CAFES.forEach(function(c){
    var inWin=function(r){return r.cafe===c.id&&r.t>=since};
    var att=sheetRows.attendees.filter(inWin), emp=sheetRows.employees.filter(inWin);
    mine.forEach(function(m){if(inWin(m)&&!seenInSheet(m)) att.push(m)});   // this phone's own answers count as attendee answers
    report[c.id]={
      attendees:att.length?{seats:mean(att,'seats'),noise:mean(att,'noise'),reports:att.length}:null,
      employees:emp.length?{seats:mean(emp,'seats'),noise:mean(emp,'noise'),reports:emp.length}:null
    };
    var groups=[att,emp].filter(function(g){return g.length});
    var L0=c.locations[0];
    if(!groups.length){ if(L0.has){L0.has=false;changed=true} return }   // no recent answers: show 'no recent data'
    // 50/50 between attendees and employees (or whichever group has answers)
    var seats=groups.reduce(function(a,g){return a+mean(g,'seats')},0)/groups.length;
    var noise=groups.reduce(function(a,g){return a+mean(g,'noise')},0)/groups.length;
    var tp=toPercent(seats), np=toPercent(noise);
    if(!L0.has||L0.tables!==tp||L0.noise!==np){ L0.has=true; L0.tables=tp; L0.noise=np; changed=true }   // only redraw when something changed
  });
  window.CafeHoppers.lastReport=report;
  if(changed) refresh(); // type CafeHoppers.lastReport in the browser console to compare groups
}

function loadScores(){
  Promise.all([getCSV(SHEETS.attendees),getCSV(SHEETS.employees)]).then(function(r){
    sheetRows.attendees=readRows(r[0]); sheetRows.employees=readRows(r[1]); sheetOK=!!r[0];
    diag.sheet=r[0]?('loaded, '+sheetRows.attendees.length+' usable rows'+(r[0]&&!sheetRows.attendees.length?' (none match the expected columns/cafes)':'')):'COULD NOT LOAD (blocked, offline, or sheet not shared)';
    recompute();
    if(!firstLoad){firstLoad=true;refresh()}
  });
}
recompute();
loadScores();
setInterval(loadScores,REFRESH_SECONDS*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) loadScores()});   // refresh the moment someone comes back to the app

/* Add ?debug=1 to the page address to see a small status box about sending and the sheet. */
if(/[?&]debug\b/.test(location.search)){
  var box=document.createElement('pre'); box.id='diag';
  box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;margin:0;padding:10px 12px;border-radius:10px;background:rgba(20,12,8,.88);color:#fff;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;pointer-events:none';
  document.body.appendChild(box);
  var drawDiag=function(){
    var L=['survey form connected: '+(formReady()?'yes':'NO'),'attendee sheet: '+diag.sheet];
    if(diag.sent){
      var m=diag.sent, found=sheetRows.attendees.some(function(r){return r.cafe===m.cafe&&r.seats===m.seats&&r.noise===m.noise&&r.t>=m.t-120000&&r.t<=m.t+600000});
      L.push('last answer sent: '+m.cafe+' '+m.seats+'/'+m.noise+' at '+new Date(m.t).toLocaleTimeString()+' -> '+diag.msg);
      L.push('that answer found in the sheet: '+(found?'YES (delivered)':'not yet ('+Math.round((Date.now()-m.t)/1000)+'s ago; the app checks every '+REFRESH_SECONDS+'s)'));
    }else L.push('no answer sent from this device yet');
    box.textContent=L.join('\n');
  };
  setInterval(drawDiag,1000); drawDiag();
}

go('welcome');
})();
</script>
